# run main.py
name: Auto Sign
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install cryptography
      - name: Run main.py
        env:
          GitHub_Actions: true
          # 对于多个账号一定会有人机验证问题，且因为是密码，有一定的安全风险
          # PHONE: ${{ secrets.PHONE }}
          # PASSWORD: ${{ secrets.PASSWORD }}
          TOKEN: ${{ secrets.TOKEN }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SC3_UID: ${{ secrets.SC3_UID }}
          EXIT_WHEN_FAIL: ${{ vars.EXIT_WHEN_FAIL }}
        run: |
          python src/main.py
          
  # 这个是为你的主要任务保驾护航的“续期”任务
  keepalive-job:
    name: alive
    runs-on: ubuntu-latest
    permissions:
      actions: write      # 必须有这个权限才能触发操作
      contents: write     # 必须有这个权限才能提交代码（如果需要使用 commit 模式）
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2  # 使用公开的保持活跃组件
